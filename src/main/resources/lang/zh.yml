# === 已移除的配置键 ===
removed_key_warning: "{FILE} 仍包含 '{KEY}'，当前版本的 UltiMail 已不再读取该键。{REASON} 从文件中删除该键即可消除此警告。"
removed_key_reason_mail_expire_days: "它从未生效：本模块没有邮件过期机制，邮件会一直保留到玩家删除为止。邮件过期已作为功能请求记录在 UltiKits/UltiMail#34（UltiKits/UltiMail#23）。"
removed_key_reason_new_mail: "它的值从未显示给玩家。登录时的未读邮件提醒取自本模块语言文件（lang/<language>.yml，与 config/mail.yml 位于同一模块文件夹）中的 'notify_new_mail' 条目，因此跟随服务器的语言设置；要修改请改那里，并在旧键使用 {COUNT} 的位置保留该条目的 {0} 占位符（去掉 {0} 的修改会被拒绝）。提醒会把未读数量填入 {0}（UltiKits/UltiMail#23、UltiKits/UltiMail#24）。"
removed_key_reason_mail_sent: "它的值从未显示给玩家。发件人发送邮件后收到的确认取自本模块语言文件（lang/<language>.yml，与 config/mail.yml 位于同一模块文件夹）中的 'mail_sent_success' 条目，因此跟随服务器的语言设置；要修改请改那里，在旧键使用 {PLAYER} 的位置改用 {RECEIVER} 表示收件人名字（UltiKits/UltiMail#23）。"
