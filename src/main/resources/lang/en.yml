# === Removed Configuration Keys ===
removed_key_warning: "{FILE} still contains '{KEY}', which this version of UltiMail no longer reads. {REASON} Delete the key from the file to silence this warning."
removed_key_reason_mail_expire_days: "It never had an effect: this module has no mail expiry, and a mail is kept until a player deletes it. Mail expiry is a feature request, UltiKits/UltiMail#34 (UltiKits/UltiMail#23)."
removed_key_reason_new_mail: "Its value was never shown to players. The unread-mail notification on join takes its text from the 'notify_new_mail' entry of this module's language file (lang/<language>.yml, in the same module folder as config/mail.yml), so it follows the server's language setting; edit it there, keeping that entry's {0} placeholder where the old key used {COUNT} (an edit that drops {0} is refused). The notification puts the unread count into {0} (UltiKits/UltiMail#23, UltiKits/UltiMail#24)."
removed_key_reason_mail_sent: "Its value was never shown to players. The confirmation a sender gets after sending a mail takes its text from the 'mail_sent_success' entry of this module's language file (lang/<language>.yml, in the same module folder as config/mail.yml), so it follows the server's language setting; edit it there, using {RECEIVER} for the receiver's name where the old key used {PLAYER} (UltiKits/UltiMail#23)."
